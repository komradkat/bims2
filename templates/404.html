{% extends 'base_simple.html' %}

{% block title %}404 - Page Not Found | BIMS{% endblock %}

{% block content %}
<div class="max-w-md text-center py-20">
    <div class="mb-8">
        <i class="fa-solid fa-link-slash text-9xl text-primary opacity-20"></i>
    </div>
    <h1 class="text-9xl font-bold text-primary mb-4">404</h1>
    <h2 class="text-2xl font-semibold mb-4">Oops! Page not found.</h2>
    <p class="text-base-content/70 mb-8">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary">
        <i class="fa-solid fa-house mr-2"></i> Back to Dashboard
    </a>
</div>
{% endblock %}
