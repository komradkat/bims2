{% extends 'base_simple.html' %}

{% block title %}500 - Server Error | BIMS{% endblock %}

{% block content %}
<div class="max-w-md text-center py-20">
    <div class="mb-8">
        <i class="fa-solid fa-triangle-exclamation text-9xl text-error opacity-20"></i>
    </div>
    <h1 class="text-9xl font-bold text-error mb-4">500</h1>
    <h2 class="text-2xl font-semibold mb-4">Something went wrong.</h2>
    <p class="text-base-content/70 mb-8">
        Our system encountered an unexpected error. Don't worry, our team has been notified and is looking into it.
    </p>
    <div class="flex flex-col gap-4">
        <a href="javascript:location.reload()" class="btn btn-error btn-outline">
            <i class="fa-solid fa-rotate mr-2"></i> Try Refreshing
        </a>
        <a href="{% url 'core:dashboard' %}" class="btn btn-ghost">
            <i class="fa-solid fa-house mr-2"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
