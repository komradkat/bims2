<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ certificate.certificate_type.name }} - {{ certificate.resident.full_name }}</title>
    <style>
        @page {
            size: A4;
            margin: 0; /* Remove default margin to handle border positioning */
        }
        body {
            font-family: 'Times New Roman', serif;
            font-size: 12pt;
            line-height: 1.5;
            color: #000;
            margin: 0;
            padding: 1.25cm; /* Outer padding */
        }
        
        /* Double Border Container */
        .border-container {
            border: 3px solid #3366CC; /* Thick outer blue border */
            padding: 3px;
            height: 27cm; /* Approximate A4 height minus margins */
            position: relative;
        }
        .inner-border {
            border: 1px solid #3366CC; /* Thin inner blue border */
            height: 100%;
            padding: 1cm;
            box-sizing: border-box;
            position: relative;
        }
        
        /* Corner Dots (Optional decorative touch matching reference) */
        .corner-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #3366CC;
            z-index: 10;
        }
        .tl { top: -4px; left: -4px; }
        .tr { top: -4px; right: -4px; }
        .bl { bottom: -4px; left: -4px; }
        .br { bottom: -4px; right: -4px; }

        /* Header / Banner */
        .header-banner {
            text-align: center;
            margin-top: 1cm;
            margin-bottom: 0.5cm;
            border: 2px solid #99BBFF; /* Light blue border */
            background-color: #E6F0FF; /* Very light blue background */
            padding: 10px 0;
            position: relative;
        }
        
        .header-title {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 22pt;
            color: #003366; /* Dark Blue */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        
        /* Dashes on side of title - Moved to HTML for PDF compatibility */
        
        .control-number {
            text-align: center;
            color: #6666FF; /* Purple-ish Blue */
            font-style: italic;
            font-weight: bold;
            font-size: 11pt;
            margin-bottom: 1.5cm;
        }

        /* Body Content */
        .content {
            margin: 0 1cm;
            text-align: justify;
            font-size: 13pt; /* Slightly larger for readability */
        }
        
        /* ... existing styles ... */
        
    </style>
</head>
<body>
    <div class="border-container">
        <!-- Corner Dots -->
        <div class="corner-dot tl"></div>
        <div class="corner-dot tr"></div>
        <div class="corner-dot bl"></div>
        <div class="corner-dot br"></div>
        
        <div class="inner-border">
            
            <!-- Banner Header -->
            <div class="header-banner">
                <h1 class="header-title">&mdash; {{ certificate.certificate_type.name }} &mdash;</h1>
            </div>
            
            <div class="control-number">No. {{ certificate.transaction_number|slice:"-4:" }}</div>

            <div class="content">
                {% block document_content %}{% endblock %}
            </div>

            <div class="signature-section">
                <div style="display: inline-block; text-align: center;">
                    <div class="signatory-name">{{ barangay.captain_name|default:"HON. [CAPTAIN NAME]" }}</div>
                    <div class="signatory-title">Punong Barangay</div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
