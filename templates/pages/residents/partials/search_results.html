<div class="absolute z-50 w-full mt-1 bg-base-100 border border-base-200 rounded-lg shadow-xl max-h-60 overflow-y-auto">
    {% for resident in residents %}
    <div class="px-4 py-3 hover:bg-base-200 cursor-pointer border-b border-base-100 last:border-none flex items-center justify-between group"
         @click="selectedResident = '{{ resident.full_name }}'; 
                selectedResidentId = '{{ resident.id }}'; 
                searchResults = false">
        <div class="flex items-center gap-3">
            <div class="avatar placeholder">
                <div class="bg-primary/10 text-primary rounded-full w-8 h-8">
                    <span class="text-xs">{{ resident.first_name.0 }}{{ resident.last_name.0 }}</span>
                </div>
            </div>
            <div>
                <div class="font-bold text-sm">{{ resident.full_name }}</div>
                <div class="text-xs opacity-50">{{ resident.purok }} • ID: {{ resident.id }}</div>
            </div>
        </div>
        <i class="fas fa-plus text-primary opacity-0 group-hover:opacity-100 transition-opacity"></i>
    </div>
    {% empty %}
    <div class="px-4 py-3 text-sm text-base-content/50 italic">
        No residents found.
    </div>
    {% endfor %}
</div>
