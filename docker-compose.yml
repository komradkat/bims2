services:
  db:
    image: postgres:15-alpine
    container_name: bims2_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-bims2}
      - POSTGRES_USER=${DATABASE_USER:-bims2_user}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-bims2_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-bims2_user} -d ${DATABASE_NAME:-bims2}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    container_name: bims2_web
    volumes:
      - bims_data:/app/data
      - static_volume:/app/dist/staticfiles
      - media_volume:/app/dist/media
    env_file:
      - .env
    environment:
      - BIMS_PROFILE=production
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    container_name: bims2_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  bims_data:
  static_volume:
  media_volume:
