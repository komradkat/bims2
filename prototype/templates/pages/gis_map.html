<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Map - BIMS</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Taildwind & DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

    <div id="app">
        <div class="flex justify-between items-center mb-4 h-12">
            <div>
                <h1 class="text-2xl font-bold">Barangay GIS Map</h1>
            </div>
             <div class="flex gap-2">
                <select class="select select-bordered select-sm">
                    <option selected>Map View</option>
                    <option>Satellite</option>
                </select>
                 <select class="select select-bordered select-sm">
                    <option disabled selected>Layers</option>
                    <option>Population Density</option>
                    <option>Flood Hazard Zones</option>
                    <option>Purok Boundaries</option>
                </select>
            </div>
        </div>

        <!-- Map Placeholder -->
        <div class="w-full h-[calc(100vh-180px)] bg-base-300 rounded-xl relative overflow-hidden border border-base-300 group">
             <!-- Fake Map Background Pattern -->
            <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#444 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <div class="absolute inset-0 flex items-center justify-center flex-col text-base-content/40 transition-opacity group-hover:opacity-60">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <div class="text-xl font-bold">Interactive GIS Map</div>
                <p>Visualization loading...</p>
            </div>

            <!-- Fake Map Points -->
            <div class="absolute top-1/4 left-1/4 w-4 h-4 rounded-full bg-error animate-ping"></div>
            <div class="absolute top-1/4 left-1/4 w-4 h-4 rounded-full bg-error border-2 border-white shadow-lg cursor-pointer" title="Incident Reported"></div>

            <div class="absolute bottom-1/3 right-1/4 w-3 h-3 rounded-full bg-primary shadow-lg cursor-pointer" title="Household"></div>
             <div class="absolute bottom-1/3 right-1/4 translate-x-4 w-3 h-3 rounded-full bg-primary shadow-lg cursor-pointer" title="Household"></div>
              <div class="absolute bottom-1/3 right-1/4 translate-y-4 w-3 h-3 rounded-full bg-primary shadow-lg cursor-pointer" title="Household"></div>
        </div>
    </div>

    <script src="../../static/js/layout.js"></script>
</body>
</html>
